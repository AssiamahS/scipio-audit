name: pages

# publish ONLY the dashboard + tracker data. the old branch-based pages
# build served the entire repo, including auto-apply/profile.json
# (phone/email/address) — never go back to that.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: stage public files
        # this mirror ships example data only (tracker, logs, resumes and
        # profile are stripped), so every copy is optional and the examples
        # stand in for the live files the dashboard expects
        run: |
          mkdir -p _site
          for f in index.html reports.html resumes.html review.html; do
            [ -f "$f" ] && cp "$f" _site/ || true
          done
          [ -f jobs.json ] && cp jobs.json _site/ || cp jobs.example.json _site/jobs.json
          [ -f auto-apply/apply_log.json ] && cp auto-apply/apply_log.json _site/ || cp auto-apply/apply_log.example.json _site/apply_log.json
          for f in resume_scores.json rejections.json confirmations.json needs_reply.json funnel_stats.json; do
            [ -f "auto-apply/$f" ] && cp "auto-apply/$f" "_site/$f" || true
          done
          for f in f500_coverage.json resume.md F500.json f500_salaries.json; do
            [ -f "$f" ] && cp "$f" "_site/$f" || true
          done
          for d in resumes resumes-src reviews; do
            [ -d "$d" ] && mkdir -p "_site/$d" && cp -R "$d/." "_site/$d/" || true
          done
          mkdir -p _site/resumes_tailored
          cp auto-apply/resumes_tailored/*.pdf _site/resumes_tailored/ 2>/dev/null || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
